name: Update Threads football feeds

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the RSS timestamp and force a Threads API refresh
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-football-feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify updater
        run: npm test
      - name: Refresh stale feeds
        run: npm run update
      - name: Publish generated RSS
        run: |
          if git diff --quiet -- feeds; then
            echo "RSS feed is already fresh."
            exit 0
          fi
          git config user.name "threads-rss-bot"
          git config user.email "threads-rss-bot@users.noreply.github.com"
          git add feeds
          git commit -m "Refresh Threads football feeds"
          git push
